<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1c1830;color:#f5efe3;font:17px/1.5 Georgia,"PT Serif",serif;text-align:center}
main{padding:32px 20px;max-width:420px}
img{width:96px;height:96px;border-radius:24px}
h1{font-size:24px;font-weight:normal;margin:18px 0 8px}
p{margin:0 0 24px;color:#cfc6dd}
a.btn{display:inline-block;background:#f0c46a;color:#1c1830;text-decoration:none;padding:14px 28px;border-radius:999px;font:600 17px/1 system-ui,sans-serif}

</head>
<body>
<main>
<img src="icon-128.png" alt="">
<h1>Открываем вашу сказку…</h1>
<p>Сейчас откроется Telegram. Если этого не случилось, нажмите кнопку.</p>
<a class="btn" id="go" href="https://t.me/Skazka_segodnya_bot?start=p_vk">Открыть в Telegram</a>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var tail = (q.get('a') || '').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 40);
  var start = 'p_vk' + (tail ? '_' + tail : '');
  var web = 'https://t.me/Skazka_segodnya_bot?start=' + start;
  var app = 'tg://resolve?domain=Skazka_segodnya_bot&start=' + start;
  document.getElementById('go').href = web;
  // Сначала приложение Telegram, через секунду страница t.me как запасной путь.
  setTimeout(function(){ location.href = app; }, 150);
  setTimeout(function(){ location.href = web; }, 1300);
})();
</script>
</body>
